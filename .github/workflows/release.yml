name: Release APK

# Push a tag like v1.0.1 -> signed APK is built and published as a GitHub Release.
# The app checks "latest release" and offers the update to users.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). A debug-signed APK would break updates, so the build is stopped."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk belling.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: belling.apk
          generate_release_notes: true
